name: Build and merge containers

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  packages: write
  contents: write
  id-token: write
  attestations: write

jobs:
  build_container:
    name: Build and Push Container (${{ matrix.variant }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, gpu]
        os: [blacksmith-2vcpu-ubuntu-2404]
    env:
      GHCR_IMAGE: ghcr.io/taranis-ai/taranis-${{ github.event.repository.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove unnecessary files
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set metadata for variant ${{ matrix.variant }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          labels: |
            org.opencontainers.image.architecture=${{ endsWith(matrix.os, '-arm') && 'arm64' || 'amd64' }}

      - name: Build and push container for variant ${{ matrix.variant }}
        uses: docker/build-push-action@v6
        id: build
        with:
          file: Containerfile.${{ matrix.variant }}
          platforms: linux/${{ endsWith(matrix.os, '-arm') && 'arm64' || 'amd64' }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}-cache-${{ endsWith(matrix.os, '-arm') && 'arm64' || 'amd64' }}:${{ matrix.variant }}
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }}-cache-${{ endsWith(matrix.os, '-arm') && 'arm64' || 'amd64' }}:${{ matrix.variant }},mode=max
          outputs: |
            type=image,"name=${{ env.GHCR_IMAGE }}",push-by-digest=true,name-canonical=true,push=true,compression=zstd

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.os }}-${{ matrix.variant }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge_container:
    name: Merge Container Manifests
    needs: build_container
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, gpu]
    uses: taranis-ai/github-actions/.github/workflows/merge-multiarch-bot-container.yml@master
    with:
      ghcr_image: ghcr.io/taranis-ai/taranis-${{ github.event.repository.name }}
      model: ${{ matrix.variant }}
      latest: ${{ matrix.variant == 'gpu' }}
