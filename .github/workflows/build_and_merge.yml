name: Build containers

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  packages: write
  contents: write
  id-token: write
  attestations: write

jobs:
  build_container:
    name: Build and Push Container (${{ matrix.model }}:${{ matrix.variant }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            os: blacksmith-2vcpu-ubuntu-2404
            model: qwen3.5-2b-gguf
            model_id: unsloth/Qwen3.5-2B-GGUF
            model_file: Qwen3.5-2B-UD-Q4_K_XL.gguf
            model_dir: /models/unsloth-Qwen3.5-2B-GGUF
          - variant: cpu
            os: blacksmith-2vcpu-ubuntu-2404
            model: qwen3.5-9b-gguf
            model_id: unsloth/Qwen3.5-9B-GGUF
            model_file: Qwen3.5-9B-UD-Q4_K_XL.gguf
            model_dir: /models/unsloth-Qwen3.5-9B-GGUF
          - variant: cpu
            os: blacksmith-2vcpu-ubuntu-2404
            model: gemma4-e4b-gguf
            model_id: unsloth/gemma-4-E4B-it-GGUF
            model_file: gemma-4-E4B-it-UD-Q4_K_XL.gguf
            model_dir: /models/unsloth-gemma-4-E4B-it-GGUF
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove unnecessary files
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set metadata for variant ${{ matrix.model }}:${{ matrix.variant }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/taranis-ai/${{ matrix.model }}
          labels: |
            org.opencontainers.image.architecture=${{ endsWith(matrix.os, '-arm') && 'arm64' || 'amd64' }}

      - name: Build and push container for variant ${{ matrix.model }}:${{ matrix.variant }}
        uses: docker/build-push-action@v6
        id: build
        with:
          file: Containerfile.${{ matrix.variant }}
          platforms: linux/${{ endsWith(matrix.os, '-arm') && 'arm64' || 'amd64' }}
          build-args: |
            MODEL_ID=${{ matrix.model_id }}
            MODEL_FILE=${{ matrix.model_file }}
            MODEL_DIR=${{ matrix.model_dir }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          cache-from: type=registry,ref=ghcr.io/taranis-ai/${{ matrix.model }}-cache-${{ endsWith(matrix.os, '-arm') && 'arm64' || 'amd64' }}:${{ matrix.variant }}
          cache-to: type=registry,ref=ghcr.io/taranis-ai/${{ matrix.model }}-cache-${{ endsWith(matrix.os, '-arm') && 'arm64' || 'amd64' }}:${{ matrix.variant }},mode=max
          outputs: |
            type=image,"name=ghcr.io/taranis-ai/${{ matrix.model }}",push-by-digest=true,name-canonical=true,push=true,compression=zstd

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Retag image as ${{ matrix.model }}:${{ matrix.variant }}
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/taranis-ai/${{ matrix.model }}:${{ matrix.variant }}" \
            "ghcr.io/taranis-ai/${{ matrix.model }}@${{ steps.build.outputs.digest }}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.os }}-${{ matrix.model }}-${{ matrix.variant }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
